<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='400' height='400' viewBox='0 0 400 400'>
  <!-- Mosaico del fondo: cruces, fotitos, palomas, ramitas de olivo, anillos, corazones, flores y destellos.
       Todo muy suave. Se repite en toda la página; los elementos quedan lejos del borde para no cortarse. -->
  <defs>
    <path id='p-cruz' d='M0 -10V10M-6 -4H6'/>
    <g id='p-paloma'>
      <path d='M-13 3C-9 -4 -1 -6 5 -3C7 -8 12 -9 15 -6C13 -4 12 -2 14 0C9 5 -3 8 -13 3Z'/>
      <path d='M-3 -2C-2 -9 4 -13 10 -12C7 -8 5 -5 1 -1'/>
      <path d='M-13 3L-19 6M-13 3L-18 0'/>
    </g>
    <g id='p-ramita'>
      <path d='M0 16C-3 6 3 -4 0 -16' fill='none'/>
      <ellipse cx='-6' cy='8' rx='5.5' ry='2.3' transform='rotate(-38 -6 8)' stroke='none'/>
      <ellipse cx='5' cy='3' rx='5.5' ry='2.3' transform='rotate(38 5 3)' stroke='none'/>
      <ellipse cx='-5' cy='-4' rx='5' ry='2.1' transform='rotate(-40 -5 -4)' stroke='none'/>
      <ellipse cx='4' cy='-10' rx='4.6' ry='2' transform='rotate(40 4 -10)' stroke='none'/>
      <ellipse cx='0' cy='-17' rx='2' ry='4' stroke='none'/>
    </g>
    <g id='p-anillos'>
      <circle cx='-5' cy='0' r='7'/><circle cx='5' cy='0' r='7'/>
      <path d='M4 -9.5L6 -12.5L8 -9.5L6 -7Z'/>
    </g>
    <path id='p-corazon' d='M0 5C-9 -1 -7 -9 -2 -8C-1 -8 0 -6.5 0 -6C0 -6.5 1 -8 2 -8C7 -9 9 -1 0 5Z'/>
    <g id='p-flor'>
      <ellipse cx='0' cy='-5' rx='3' ry='4.6'/>
      <ellipse cx='0' cy='-5' rx='3' ry='4.6' transform='rotate(72)'/>
      <ellipse cx='0' cy='-5' rx='3' ry='4.6' transform='rotate(144)'/>
      <ellipse cx='0' cy='-5' rx='3' ry='4.6' transform='rotate(216)'/>
      <ellipse cx='0' cy='-5' rx='3' ry='4.6' transform='rotate(288)'/>
      <circle r='2' fill='#D9C49A' stroke='none'/>
    </g>
    <path id='p-destello' d='M0 -6C.6 -1.2 1.2 -.6 6 0C1.2 .6 .6 1.2 0 6C-.6 1.2 -1.2 .6 -6 0C-1.2 -.6 -.6 -1.2 0 -6Z'/>
  </defs>

  <g fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <!-- cruces -->
    <use class='cruz' href='#p-cruz' transform='translate(50 60)' stroke='#8E9F82' stroke-opacity='.55' stroke-width='1.5'/>
    <use class='cruz' href='#p-cruz' transform='translate(327 65) scale(.8)' stroke='#8C4F55' stroke-opacity='.4' stroke-width='1.6'/>
    <use class='cruz' href='#p-cruz' transform='translate(210 197) scale(1.1)' stroke='#8E9F82' stroke-opacity='.5' stroke-width='1.4'/>
    <use class='cruz' href='#p-cruz' transform='translate(42 200) scale(.75)' stroke='#8C4F55' stroke-opacity='.35' stroke-width='1.7'/>
    <use class='cruz' href='#p-cruz' transform='translate(357 327)' stroke='#8E9F82' stroke-opacity='.5' stroke-width='1.5'/>
    <use class='cruz' href='#p-cruz' transform='translate(187 357) scale(.8)' stroke='#8E9F82' stroke-opacity='.45' stroke-width='1.6'/>
    <!-- palomas -->
    <use class='paloma' href='#p-paloma' transform='translate(255 40) rotate(-8) scale(1.1)' stroke='#9AA58F' stroke-opacity='.65' stroke-width='1.3'/>
    <use class='paloma' href='#p-paloma' transform='translate(178 266) rotate(6)' stroke='#B8A98D' stroke-opacity='.6' stroke-width='1.3'/>
    <!-- anillos -->
    <use class='anillos' href='#p-anillos' transform='translate(214 112) rotate(-12)' stroke='#C2A878' stroke-opacity='.65' stroke-width='1.3'/>
    <use class='anillos' href='#p-anillos' transform='translate(48 262) rotate(10) scale(.9)' stroke='#C2A878' stroke-opacity='.6' stroke-width='1.3'/>
    <!-- corazones -->
    <use class='corazon' href='#p-corazon' transform='translate(270 104)' stroke='#B77A80' stroke-opacity='.6' stroke-width='1.3'/>
    <use class='corazon' href='#p-corazon' transform='translate(132 352) scale(.9)' stroke='#B77A80' stroke-opacity='.55' stroke-width='1.3'/>
    <use class='corazon' href='#p-corazon' transform='translate(372 152) scale(.8)' stroke='#B77A80' stroke-opacity='.5' stroke-width='1.3'/>
    <use class='corazon' href='#p-corazon' transform='translate(20 352) scale(.85)' fill='#B77A80' fill-opacity='.22' stroke='#B77A80' stroke-opacity='.5' stroke-width='1.2'/>
  </g>

  <!-- ramitas de olivo -->
  <g fill='#9FB08F' fill-opacity='.5' stroke='#8E9F82' stroke-opacity='.6' stroke-width='1.2' stroke-linecap='round'>
    <use class='ramita' href='#p-ramita' transform='translate(24 124) rotate(18)'/>
    <use class='ramita' href='#p-ramita' transform='translate(352 250) rotate(-12)'/>
    <use class='ramita' href='#p-ramita' transform='translate(118 172) rotate(-20) scale(.9)'/>
  </g>

  <!-- flores pequeñas -->
  <g fill='#E8C9C4' fill-opacity='.55' stroke='#C9A29E' stroke-opacity='.5' stroke-width='1'>
    <use class='flor' href='#p-flor' transform='translate(182 126)'/>
    <use class='flor' href='#p-flor' transform='translate(336 120) scale(.85)'/>
    <use class='flor' href='#p-flor' transform='translate(64 346) scale(.9)'/>
  </g>

  <!-- destellos y puntitos -->
  <g fill='#D9C49A' fill-opacity='.7'>
    <use class='destello' href='#p-destello' transform='translate(180 24)'/>
    <use class='destello' href='#p-destello' transform='translate(24 30) scale(.8)'/>
    <use class='destello' href='#p-destello' transform='translate(104 130) scale(.9)'/>
    <use class='destello' href='#p-destello' transform='translate(252 236)'/>
    <use class='destello' href='#p-destello' transform='translate(234 322) scale(.8)'/>
    <use class='destello' href='#p-destello' transform='translate(374 208) scale(.9)'/>
  </g>
  <g fill='#C7B79B' fill-opacity='.45'>
    <circle cx='96' cy='188' r='1.7'/><circle cx='300' cy='22' r='1.7'/><circle cx='388' cy='110' r='1.7'/>
    <circle cx='80' cy='384' r='1.7'/><circle cx='270' cy='290' r='1.7'/><circle cx='20' cy='86' r='1.7'/>
    <circle cx='150' cy='214' r='1.7'/><circle cx='328' cy='392' r='1.7'/><circle cx='230' cy='160' r='1.7'/>
  </g>

  <!-- fotitos inclinadas -->
  <g class='foto' transform='translate(140 72) rotate(-8)'>
    <rect x='-17' y='-21' width='34' height='42' rx='2' fill='#fff' fill-opacity='.85' stroke='#D8CBB4' stroke-opacity='.9' stroke-width='1'/>
    <rect x='-13' y='-17' width='26' height='27' rx='1' fill='#E7DCC7' fill-opacity='.9'/>
    <circle cx='-5' cy='-9' r='3' fill='#F6EEDF'/>
    <path d='M-13 10L-6 0L0 6L5 -1L13 10Z' fill='#BFCAB5' fill-opacity='.9'/>
  </g>
  <g class='foto' transform='translate(295 172) rotate(7)'>
    <rect x='-17' y='-21' width='34' height='42' rx='2' fill='#fff' fill-opacity='.85' stroke='#D8CBB4' stroke-opacity='.9' stroke-width='1'/>
    <rect x='-13' y='-17' width='26' height='27' rx='1' fill='#EAD9D3' fill-opacity='.9'/>
    <path d='M0 -2C-1 -6 -7 -6 -6 -1C-5 3 0 6 0 6C0 6 5 3 6 -1C7 -6 1 -6 0 -2Z' fill='#B77A80' fill-opacity='.75'/>
  </g>
  <g class='foto' transform='translate(95 298) rotate(-5)'>
    <rect x='-17' y='-21' width='34' height='42' rx='2' fill='#fff' fill-opacity='.85' stroke='#D8CBB4' stroke-opacity='.9' stroke-width='1'/>
    <rect x='-13' y='-17' width='26' height='27' rx='1' fill='#DDE3D2' fill-opacity='.9'/>
    <circle cx='4' cy='-8' r='3' fill='#F6EEDF'/>
    <path d='M-13 10L-4 -2L3 5L8 0L13 10Z' fill='#9FB08F' fill-opacity='.85'/>
  </g>
  <g class='foto' transform='translate(282 358) rotate(6)'>
    <rect x='-17' y='-21' width='34' height='42' rx='2' fill='#fff' fill-opacity='.85' stroke='#D8CBB4' stroke-opacity='.9' stroke-width='1'/>
    <rect x='-13' y='-17' width='26' height='27' rx='1' fill='#E9DFCB' fill-opacity='.9'/>
    <circle cx='0' cy='-8' r='3.4' fill='#F6EEDF'/>
    <path d='M-13 10C-12 2 12 2 13 10Z' fill='#C9B79A' fill-opacity='.85'/>
  </g>
</svg>
